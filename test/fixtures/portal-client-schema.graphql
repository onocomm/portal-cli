# Minimal public client contract for the 36 catalog queries.
# Field, argument and type signatures match the Portal schema.
# Unused fields, impersonation arguments and server-only definitions are omitted.

scalar AWSJSON

type Query {
  getAuthUser: AuthUser
  getAWS(account_no: String!): AWS
  getBill(bill_no: String!): Bill
  getCustomer(customer_no: String!): Customer
  getDomain(domain_name: String!): Domain
  getInvoice(invoice_no: String!): Invoice
  getMail(domain_name: String!): Mail
  getNS53(ns53_no: String!): NS53
  getOnocommMembers(contract_no: String!): OnocommMembers
  getOrder(order_no: String!): Order
  getQuotation(quotation_no: String!): Quotation
  getServer(server_no: String!): Server
  getServerless(system_name: String!): Serverless
  getSSL(ssl_name: String!): SSL
  getStorage(storage_id: String!): Storage
  getSupportCase(case_id: String!): SupportCase
  getSupportCaseByNumber(case_number: String!): SupportCase
  getWorkReport(reportId: String!): WorkReport
  queryAnnouncement(limit: Int, nextToken: String): AnnouncementConnection
  queryInvoice(invoice_flag: String!, start_date: Int!, end_date: Int!, limit: Int, nextToken: String): InvoiceConnection
  querySupportCaseComment(case_id: String!, limit: Int, nextToken: String): SupportCaseCommentConnection
  querySupportCaseV2(account_no: String, status: String, start_date: Int, end_date: Int, limit: Int, nextToken: String): SupportCaseConnection
  queryWorkReport(customer_no: String!, limit: Int, nextToken: String): WorkReportConnection
  scanAWS(limit: Int, nextToken: String): AWSConnection
  scanBill(limit: Int, nextToken: String): BillConnection
  scanCustomer(limit: Int, nextToken: String): CustomerConnection
  scanDomain(limit: Int, nextToken: String): DomainConnection
  scanMail(limit: Int, nextToken: String): MailConnection
  scanNS53(limit: Int, nextToken: String): NS53Connection
  scanOnocommMembers(limit: Int, nextToken: String): OnocommMembersConnection
  scanOrder(limit: Int, nextToken: String): OrderConnection
  scanQuotation(limit: Int, nextToken: String): QuotationConnection
  scanServer(limit: Int, nextToken: String): ServerConnection
  scanServerless(limit: Int, nextToken: String): ServerlessConnection
  scanSSL(limit: Int, nextToken: String): SSLConnection
  scanStorage(limit: Int, nextToken: String): StorageConnection
}

